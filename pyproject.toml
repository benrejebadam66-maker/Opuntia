[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "opuntia-engine"
version = "0.1.0"
description = "Opuntia next-gen perception and execution engine"
requires-python = ">=3.11"
dependencies = [
    "uiautomation>=2.0.18",
    "comtypes>=1.4.1",
    "Pillow>=10.0.0",
    "pydantic>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["engine*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-p no:cacheprovider"
filterwarnings = [
    "ignore:PyPDF2 is deprecated.*:DeprecationWarning",
    "ignore:'pkgutil.find_loader' is deprecated.*:DeprecationWarning",
]
markers = [
    "integration: requires live Windows desktop (deselect with -k 'not integration')",
]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
